<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>وش نتعلم اليوم؟</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(180deg,#fbf7ff,#f7f1ff);color:#302b3f}
.wrap{max-width:520px;margin:auto;padding:22px 16px 92px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.brand{font-weight:800;font-size:21px}.xp{background:#fff;border:1px solid #eadff9;padding:8px 12px;border-radius:18px;font-size:13px}
.hero{background:linear-gradient(135deg,#eadcff,#f9dff0);border-radius:28px;padding:25px 20px;text-align:center;box-shadow:0 10px 30px #cbbbe633}
.gift{font-size:58px}.hero h1{margin:8px 0 7px;font-size:25px}.hero p{margin:0 0 18px;color:#6f667d}
button{border:0;cursor:pointer;font-weight:800}.surprise{background:linear-gradient(135deg,#8e6be8,#b36fe5);color:white;padding:14px 24px;border-radius:18px;font-size:16px;box-shadow:0 8px 18px #8e6be844}
.stats{display:flex;gap:10px;margin:14px 0}.stat{flex:1;background:#fff;border:1px solid #eee3fa;border-radius:18px;padding:13px;text-align:center}.num{font-size:20px;font-weight:800}.small{font-size:12px;color:#81768e}
h2{font-size:18px;margin:24px 3px 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.cat{background:#fff;border:1px solid #eee3fa;border-radius:20px;padding:17px;text-align:right;min-height:100px}.cat b{display:block;margin-top:9px}.cat span{font-size:28px}
.challenge{display:none;background:#fff;border:1px solid #eadff9;border-radius:24px;padding:18px;margin-top:14px}.challenge.show{display:block}.answer{width:100%;padding:12px;border:1px solid #ddd0ee;border-radius:14px;margin:12px 0;font-size:16px}.check{background:#6f56c8;color:white;padding:11px 18px;border-radius:13px}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#ffffffee;backdrop-filter:blur(10px);border-top:1px solid #eee3fa;display:flex;justify-content:space-around;padding:10px 6px}.nav{background:none;color:#777;text-align:center;font-size:11px}.nav span{display:block;font-size:21px;margin-bottom:2px}
.credit{text-align:center;color:#9a8ca8;font-size:12px;margin-top:28px}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><div class="brand">وش نتعلم اليوم؟ ♡</div><div class="xp">✨ 120 XP</div></div>
<section class="hero">
<div class="gift">🎁</div>
<h1>وش راح تكتشف اليوم؟</h1>
<p>اضغط وخلي المفاجأة تختارلك تحديك ♡</p>
<button class="surprise" onclick="newChallenge()">فاجئني! 🎁</button>
</section>
<div class="stats"><div class="stat"><div class="num" id="done">12</div><div class="small">تحديات مكتملة</div></div><div class="stat"><div class="num">4</div><div class="small">أيام متتالية</div></div></div>
<div id="challenge" class="challenge"><b id="ctitle">تحديك اليوم</b><p id="cquestion"></p><input id="answer" class="answer" placeholder="اكتبي إجابتك هنا..."><button class="check" onclick="checkAnswer()">تحققي من الإجابة</button><p id="result"></p></div>
<h2>وش حاب تتعلم؟ 👇</h2>
<div class="grid">
<button class="cat" onclick="cat('🇺🇸 لغات','تعلمي كلمة إنجليزية جديدة واستعمليها في جملة.')"><span>🇺🇸</span><b>لغات</b></button>
<button class="cat" onclick="cat('🧠 ثقافة واكتشاف','اكتشفي معلومة جديدة وحاولي شرحها بكلماتك.')"><span>🧠</span><b>ثقافة واكتشاف</b></button>
<button class="cat" onclick="cat('🧩 ألغاز','حاولي حل لغز منطقي قصير.')"><span>🧩</span><b>ألغاز</b></button>
<button class="cat" onclick="cat('🎨 إبداع','اعملي فكرة صغيرة خلال 5 دقائق.')"><span>🎨</span><b>إبداع</b></button>
</div>
<div class="credit">— ♡ By imane Touaitia ♡ —</div>
</div>
<nav class="bottom"><button class="nav" onclick="window.scrollTo(0,0)"><span>⌂</span>الرئيسية</button><button class="nav" onclick="newChallenge()"><span>🎁</span>تحدي</button><button class="nav" onclick="alert('الإنجازات ستظهر هنا قريباً ♡')"><span>🏆</span>إنجازات</button><button class="nav" onclick="alert('الملف الشخصي قيد التطوير ♡')"><span>♡</span>حسابي</button></nav>
<script>
const challenges=[
['🧠 معلومة','ما هو الكوكب المعروف بالكوكب الأحمر؟','المريخ'],
['🇺🇸 English','ما معنى كلمة “guest” بالعربية؟','ضيف'],
['🧩 لغز','شيء كلما أخذت منه كبر، ما هو؟','الحفرة'],
['🌍 جغرافيا','ما هي عاصمة فرنسا؟','باريس']
];
function newChallenge(){let c=challenges[Math.floor(Math.random()*challenges.length)];document.getElementById('challenge').classList.add('show');document.getElementById('ctitle').textContent=c[0];document.getElementById('cquestion').textContent=c[1];document.getElementById('challenge').dataset.answer=c[2];document.getElementById('answer').value='';document.getElementById('result').textContent='';document.getElementById('challenge').scrollIntoView({behavior:'smooth'});}
function cat(t,q){document.getElementById('challenge').classList.add('show');document.getElementById('ctitle').textContent=t;document.getElementById('cquestion').textContent=q;document.getElementById('challenge').dataset.answer='';document.getElementById('answer').value='';document.getElementById('result').textContent='جربي وعبّري بطريقتك ♡';document.getElementById('challenge').scrollIntoView({behavior:'smooth'});}
function checkAnswer(){let a=document.getElementById('answer').value.trim().toLowerCase(),correct=document.getElementById('challenge').dataset.answer.toLowerCase();if(correct&&a===correct){document.getElementById('result').textContent='🎉 صح! +10 XP';document.getElementById('done').textContent=+document.getElementById('done').textContent+1}else{document.getElementById('result').textContent=correct?'قريبة! حاولي مرة أخرى ♡':'ممتاز! سجلي إجابتك وارجعي لها لاحقاً ♡';}}
</script>
</body>
</html>
